# Production stack for the 510(k) Navigator.
#   backend, FastAPI + LangGraph + FAISS (internal only)
#   web    , Caddy serving the built frontend + reverse-proxying /api, with auto-HTTPS
#
# SITE_ADDRESS is passed in by deploy/deploy.sh when it runs `docker compose up`.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy_data:
  caddy_config:
